<nz-header>
    <button nz-button nzType="primary" (click)="toggleCollapsed()" class="btn-styles4">
        <span nz-icon [nzType]="sidebarService.isCollapsed ? 'menu-unfold' : 'menu-fold'" nzTheme="outline"
            class="big-icon"></span>
    </button>
    <h2 nz-typography class="h2">{{username}}</h2>
</nz-header>
<nz-content>
    <div nz-row class="row-style">
        <div nz-col [nzSpan]="12" class="left-col">
            <h2 nz-typography class="boxword">個人點數資訊</h2>
            <br>
            <div class="pointbox">
                <h1 nz-typography class="boxword">我的點數</h1>
                <p class="boxnum">{{userpoint}}</p>
            </div>
            <br>
            <h5 nz-typography class="pointdate"><span nz-icon nzType="exclamation-circle" nzTheme="outline"></span> 點數將於
                {{Date}} 日到期，請盡快使用</h5>
            <br>


            <div>
                <nz-carousel nzAutoPlay [nzDots]="false">
                    @for (msg of carouselMessages; track msg) {
                    <div nz-carousel-content>
                        <h3>{{ msg }}</h3>
                    </div>
                    }
                </nz-carousel>
            </div>


            <nz-divider></nz-divider>
            <button nz-button nzType="primary" nzBlock class="btn-styles2" (click)="addpointModal()"> <span nz-icon
                    nzType="swap" nzTheme="outline"></span>轉贈點數</button>
            <nz-modal [(nzVisible)]="addpointisVisible" nzTitle="轉贈點數" [nzFooter]="null" nzWidth="520px" nzCentered [nzClosable]="false">
                <ng-container *nzModalContent>
                    <div>
                        <h5 nz-typography style="margin: 0;">選擇轉贈給:</h5>
                        <nz-select nzShowSearch nzAllowClear nzPlaceHolder="選擇轉贈給" [(ngModel)]="addpointselectedValue"
                            [nzLoading]="isLoadingMembers"  style="width: 100%; margin-top: 10px;">

                            <nz-option *ngFor="let member of members" [nzLabel]="getMemberDisplayName(member)"
                                [nzValue]="member.id">
                            </nz-option>

                        </nz-select>


                    </div>
                    <br>
                    <div>
                        <h5 nz-typography style="margin: 0;">轉贈點數數量:</h5>
                        <input nz-input placeholder="輸入數量" [(ngModel)]="pointvalue" type="number"
                            style="width: 100%; margin-top: 10px;" />
                    </div>
                    <br>
                    <div style="text-align: right;">
                        <button nz-button nzType="default" (click)="addpointisVisible=false">取消</button>
                        <button nz-button nzType="primary" class="btn-styles2">確認轉贈</button>
                    </div>
                </ng-container>
            </nz-modal>


            <button nz-button nzType="primary" nzBlock class="btn-styles2" (click)="usepointModal()">
                <span nz-icon nzType="coffee" nzTheme="outline"></span>兌換點數
            </button>

            <nz-modal [(nzVisible)]="usepointisVisible" nzTitle="兌換點數" [nzFooter]="usepointmodalFooter" nzWidth="520px"
                nzCentered [nzClosable]="false">
                <ng-container *nzModalContent>
                    <div>
                        <h5 nz-typography style="margin: 0;">兌換杯數:</h5>
                        <input nz-input placeholder="輸入數量" [(ngModel)]="capvalue" type="number"
                            style="width: 100%; margin-top: 10px;" />
                        <br>
                        
                    </div>
                    <br>
                    

                </ng-container>

                <ng-template #usepointmodalFooter>
                    <button nz-button (click)="usepointhandleCancel()">取消兌換</button>
                    <button nz-button nzType="primary" class="btn-styles2" (click)="usepointhandleOk()">兌換完成</button>
                </ng-template>
            </nz-modal>

        </div>
        <div nz-col [nzSpan]="12" class="right-col">
            <h2 nz-typography class="boxword">點數使用與規則說明</h2>
            <br>
            <div class="rulebox">
                <h3 nz-typography class="boxword">● 100點可兌換一杯咖啡</h3>
                <h3 nz-typography class="boxword">● 100點可兌換一杯咖啡</h3>
                <h3 nz-typography class="boxword">● 100點可兌換一杯咖啡</h3>
                <h3 nz-typography class="boxword">● 100點可兌換一杯咖啡</h3>
            </div>
            <nz-divider></nz-divider>
            <h2 nz-typography class="boxword">點數異動紀錄</h2>
            <br>

        </div>
    </div>
</nz-content>
