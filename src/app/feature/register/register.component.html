<nz-layout>
  <nz-header></nz-header>
  <nz-content>
    <div class="box">
      <h2 nz-typography>註冊帳號</h2>
      <div class="input-block">
        <h5 nz-typography style="margin: 0;">請輸入使用者名稱：</h5>
        <input nz-input placeholder="請輸入使用者名稱" nzSize="large" />
      </div>

      <div class="input-block">
        <h5 nz-typography style="margin: 0;">請輸入帳號：</h5>
        <input nz-input placeholder="請輸入帳號" nzSize="large" />
      </div>


      <div class="input-block">
        <h5 nz-typography style="margin: 0;">請輸入密碼：</h5>

        <nz-input-group [nzSuffix]="suffixTemplate1" nzSize="large">
          <input [type]="passwordVisible1 ? 'text' : 'password'" nz-input placeholder="請輸入密碼" [(ngModel)]="password" />
        </nz-input-group>

        <ng-template #suffixTemplate1>
          <span nz-icon class="ant-input-password-icon" [nzType]="passwordVisible1 ? 'eye-invisible' : 'eye'"
            (click)="passwordVisible1 = !passwordVisible1"></span>
        </ng-template>
      </div>

      <div class="input-block">
        <h5 nz-typography style="margin: 0;">再次確認密碼：</h5>

        <nz-input-group [nzSuffix]="suffixTemplate2" nzSize="large">
          <input [type]="passwordVisible2 ? 'text' : 'password'" nz-input placeholder="再次確認密碼"
            [(ngModel)]="confirmPassword" />
        </nz-input-group>

        <ng-template #suffixTemplate2>
          <span nz-icon class="ant-input-password-icon" [nzType]="passwordVisible2 ? 'eye-invisible' : 'eye'"
            (click)="passwordVisible2 = !passwordVisible2"></span>
        </ng-template>
      </div>



      <br>
      <button nz-button nzType="primary" nzBlock class="btn-styles1" (click)="GoLogIn()">完成註冊，返回登入介面</button>
      <button nz-button nzType="primary" nzBlock class="btn-styles2" (click)="GoLogIn()">返回登入介面</button>

    </div>
  </nz-content>

</nz-layout>
