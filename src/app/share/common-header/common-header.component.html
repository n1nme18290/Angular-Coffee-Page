<nz-header class="common-header">
  <div class="header-left">
    @if (showToggle && sidebarService.showSidebar) {
      <button nz-button nzType="primary" (click)="toggleCollapsed()" class="btn-styles4">
        <span nz-icon [nzType]="sidebarService.isCollapsed ? 'menu-unfold' : 'menu-fold'" nzTheme="outline"
          class="big-icon"></span>
      </button>
    }
    @if (title) {
      <div class="header-context">
        <h2 nz-typography class="header-title">{{ title }}</h2>
      </div>
    }
  </div>

  <div class="header-right">
    @if (showUser) {
      <div class="user-info">
        <span class="user-avatar" aria-hidden="true">
          <span nz-icon nzType="user" nzTheme="outline"></span>
        </span>
        <span class="username">{{ currentUsername }}</span>
      </div>
    }
    @if (showLogout) {
      <button nz-button class="btn-logout" (click)="logout()">
        <span nz-icon nzType="logout" nzTheme="outline"></span>
        <span>登出</span>
      </button>
    }
  </div>
</nz-header>
